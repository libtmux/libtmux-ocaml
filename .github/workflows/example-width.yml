name: Example width

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-width-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example-width:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check example width
        uses: libtmux/.github/actions/check-example-width@bd3bae79572512da032287202d74c8da03b5967b
