name: OCaml
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocaml-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPAMJOBS: '2'
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ocaml-base-compiler.5.5.2
      - name: Install development dependencies
        run: opam install . --deps-only --with-test --with-doc --yes
      - name: Install ocamlformat
        run: opam install ocamlformat.0.29.0 --yes
      - name: Verify the exact toolchain
        run: uv run scripts/toolchain/check_toolchain.py
      - name: Lint the authored manifests
        run: opam lint ./*.opam
      - name: Build all targets, installation files and documentation
        run: opam exec -- dune build @all @install @doc
      - name: Run typed assertions, expectations and properties
        run: opam exec -- dune runtest --force
      - name: Build the public interface exporter
        env:
          LIBTMUX_API_EXPORT: '1'
        run: opam exec -- dune build tools/api_export.exe
      - name: Export and verify public typed interfaces
        env:
          LIBTMUX_API_EXPORT: '1'
        run: opam exec -- uv run scripts/export_api/export_api.py --output _build/docs/ocaml.json
      - name: Check owner capability directories
        run: opam exec -- python3 test/api_directory_test.py _build/docs/ocaml.json
      - name: Check support script formatting
        run: uv run --project scripts --locked ruff format --check --config scripts/pyproject.toml scripts test
      - name: Lint support scripts
        run: uv run --project scripts --locked ruff check --config scripts/pyproject.toml scripts test
      - name: Type-check support scripts
        run: uv run --project scripts --locked ty check --project scripts scripts test
      - name: Test support scripts
        env:
          LIBTMUX_API_EXPORT: '1'
        run: opam exec -- uv run --project scripts --locked pytest scripts
      - name: Verify workspace document bounds and input backends
        run: opam exec -- python3 test/workspace_document_test.py
      - name: Check documentation snippets and links
        run: uv run scripts/docs_snippets/docs_snippets.py
      - name: Check OCaml formatting
        run: opam exec -- dune build @fmt
      - name: Check the generated field catalog
        run: opam exec -- uv run scripts/generate/generate_fields.py --check
      - name: Check the generated option catalog
        run: opam exec -- uv run scripts/generate/generate_options.py --check
      - name: Check the generated format catalog
        run: opam exec -- uv run scripts/generate/generate_formats.py --check
      - name: Check the generated operation catalog
        run: opam exec -- uv run scripts/generate/generate_operations.py --check
      - name: Check the tree has no uncommitted changes
        run: git diff --exit-code
      - name: Retain failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-diagnostics
          path: |
            _build/log
            _build/**/*.corrected
            _build/**/_tests/**
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.3a', '3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ocaml-base-compiler.5.5.2
      - name: Install test dependencies
        run: opam install . --deps-only --with-test --yes
      - uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        id: tmux
        with:
          ref: ${{ matrix.tmux }}
      - name: Build all targets and installation files
        run: opam exec -- dune build @all @install
      - name: Exercise the native clients
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: opam exec -- python3 test/native_suite.py "$TMUX_BINARY"
      - name: Exercise the installed consumer
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: opam exec -- python3 test/installed_consumer.py "$TMUX_BINARY"
      - name: Smoke-test the benchmark drivers
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: opam exec -- uv run --project scripts --locked pytest -m native scripts/bench
      - name: Execute the installed workspace documentation
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: opam exec -- python3 test/workspace_docs_test.py "$TMUX_BINARY"
      - name: Execute the standalone showcase programs
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: opam exec -- python3 test/showcase_test.py "$TMUX_BINARY"
      - name: Retain failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.tmux }}-diagnostics
          path: _build/log
