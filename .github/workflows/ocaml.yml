name: OCaml
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Verified package version
        value: ${{ jobs.package.outputs.version }}
      tag:
        description: Verified release tag
        value: ${{ jobs.package.outputs.tag }}
permissions:
  contents: read
concurrency:
  group: ocaml-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPAMJOBS: '2'
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ocaml-base-compiler.5.5.2
      - name: Install development dependencies
        run: |
          opam install . --deps-only --with-test --with-doc --yes
          opam install ocamlformat.0.29.0 --yes
      - name: Verify exact toolchain and authored manifests
        run: |
          test "$(opam exec -- ocamlc -version)" = 5.5.2
          test "$(opam exec -- dune --version)" = 3.24.2
          test "$(opam --version)" = 2.6.1
          opam lint ./*.opam
      - name: Verify release guards
        run: python3 .github/scripts/release_test.py
      - name: Build, typed assertions, expectations and properties
        run: |
          opam exec -- dune build @all @install @doc
          opam exec -- dune runtest --force
      - name: Export and verify public typed interfaces
        env:
          LIBTMUX_API_EXPORT: '1'
        run: |
          opam exec -- dune build tools/api_export.exe
          opam exec -- python3 test/api_export_test.py
          opam exec -- python3 tools/export_api.py --output _build/docs/ocaml.json
      - name: Verify workspace document bounds and input backends
        run: opam exec -- python3 test/workspace_document_test.py
      - name: Verify conformance evidence checks without a JVM
        run: python3 test/conformance/runner_test.py
      - name: Verify format and generated catalogs
        run: |
          python3 tools/docs_snippets.py
          git ls-files -z -- '*.ml' '*.mli' | xargs -0 opam exec -- ocamlformat --check
          opam exec -- python3 tools/generate_fields.py --check
          opam exec -- python3 tools/generate_options.py --check
          opam exec -- python3 tools/generate_formats.py --check
          opam exec -- python3 tools/generate_operations.py --check
          git diff --exit-code
      - name: Retain failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-diagnostics
          path: |
            _build/log
            _build/**/*.corrected
            _build/**/_tests/**
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.3a', '3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ocaml-base-compiler.5.5.2
      - name: Install test dependencies
        run: opam install . --deps-only --with-test --yes
      - uses: ./.github/actions/build-tmux
        id: tmux
        with:
          ref: ${{ matrix.tmux }}
      - name: Build and exercise native clients
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.prefix }}/bin/tmux
        run: |
          opam exec -- dune build @all @install
          opam exec -- python3 test/native_suite.py "$TMUX_BINARY"
          opam exec -- python3 test/installed_consumer.py "$TMUX_BINARY"
      - name: Execute installed documentation and standalone programs
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.prefix }}/bin/tmux
        run: |
          opam exec -- python3 test/workspace_docs_test.py "$TMUX_BINARY"
          opam exec -- python3 test/showcase_test.py "$TMUX_BINARY"
      - name: Retain failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.tmux }}-diagnostics
          path: _build/log
  package:
    name: Rehearse opam release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the source and release notes
        id: release
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          arguments=()
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            arguments+=(--tag "$RELEASE_REF_NAME" --publish)
          fi
          python3 .github/scripts/release.py check "${arguments[@]}" > dist/release.json
          jq -r '"version=\(.version)\ntag=\(.tag)"' dist/release.json >> "$GITHUB_OUTPUT"
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ocaml-base-compiler.5.5.2
      - name: Install archive validation tools
        run: |
          opam install . --deps-only --with-test --with-doc --yes
          opam install dune-release.2.3.0 --yes
          echo "OPAMSWITCH=$(opam switch show)" >> "$GITHUB_ENV"
      - name: Build and test a source archive from a private tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          source_dir="$RUNNER_TEMP/release-source"
          build_dir="$RUNNER_TEMP/release-build"
          git clone --quiet --no-local --no-tags . "$source_dir"
          git -C "$source_dir" checkout --quiet --detach "$GITHUB_SHA"
          git -C "$source_dir" -c user.name=libtmux-release -c user.email=release@example.invalid \
            tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_VERSION"
          opam exec -- dune-release distrib --pkg-dir "$source_dir" \
            --pkg-version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --build-dir "$build_dir"
          opam exec -- dune-release opam pkg --pkg-dir "$source_dir" \
            --pkg-version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --build-dir "$build_dir" \
            --dist-file "$build_dir/libtmux-$RELEASE_TAG.tbz" \
            --dist-uri "https://github.com/libtmux/libtmux-ocaml/releases/download/$RELEASE_TAG/libtmux-$RELEASE_TAG.tbz"
          cp "$build_dir/libtmux-$RELEASE_TAG.tbz" dist/
          for package in libtmux libtmux-eio libtmux-json libtmux-unix libtmux-workspace libtmux-workspace-cli; do
            mkdir -p "dist/$package.$RELEASE_VERSION"
            cp "$build_dir/$package.$RELEASE_VERSION/opam" "dist/$package.$RELEASE_VERSION/opam"
          done
          opam lint dist/*/opam
          python3 .github/scripts/release.py seal > /dev/null
      - name: Install all archived packages outside the checkout
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          consumer_dir="$RUNNER_TEMP/release-consumer"
          mkdir -p "$consumer_dir"
          tar -xjf "dist/libtmux-v$RELEASE_VERSION.tbz" -C "$consumer_dir"
          cd "$consumer_dir"
          opam install "./libtmux-v$RELEASE_VERSION" --yes
          for package in libtmux libtmux-eio libtmux-json libtmux-unix libtmux-workspace libtmux-workspace-cli; do
            test "$(opam var "$package:version")" = "$RELEASE_VERSION"
          done
          opam exec -- ocamlfind query libtmux libtmux-eio libtmux-json libtmux-unix libtmux-workspace
          opam exec -- tmux-workspace --help=plain
      - name: Verify and retain the exact archive and metadata
        run: python3 .github/scripts/release.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opam-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
