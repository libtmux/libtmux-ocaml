name: OCaml close diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPAMJOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ocaml-base-compiler.5.5.2
      - run: opam install . --deps-only --with-test --yes
      - uses: ./.github/actions/build-tmux
        id: tmux
        with:
          ref: '3.3a'
      - run: opam exec -- dune build @all @install
      - name: Collect first-close evidence
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.prefix }}/bin/tmux
        run: >-
          opam exec -- python3 test/diagnose_eio_close.py "$TMUX_BINARY"
          --repeat 20 --output _build/diagnostics/eio-close
      - name: Retain diagnostic sources and observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eio-close-diagnostics
          path: |
            _build/diagnostics/eio-close
            _build/log
