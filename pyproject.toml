[project]
name = "libtmux-ocaml-scripts"
version = "0"
description = "Support scripts and outer test drivers for libtmux for OCaml"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "ty==0.0.101"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
addopts = "--doctest-modules --import-mode=importlib -p no:cacheprovider"
pythonpath = [
    "scripts/docs_snippets",
    "scripts/export_api",
    "scripts/generate",
    "scripts/bench",
]
markers = [
    "native: starts a real tmux; set TMUX_BINARY to its path",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "C4", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# These drivers collect every cleanup failure, including BaseException, and
# report them together instead of stopping at the first.
"bench/control.py" = ["BLE001"]
"bench/mixed.py" = ["BLE001"]
"test/installed_consumer_diagnostics_test.py" = ["B023", "BLE001"]
# Helper closures are defined inside a loop and called in the same iteration.
"test/workspace_cli_test.py" = ["B023"]
"test/workspace_docs_test.py" = ["B023"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["test", "scripts/docs_snippets"]
